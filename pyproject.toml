[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgforge"
version = "0.1.0"
description = "World-class knowledge-graph embedding & link prediction (KGFuse fusion flagship)"
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.10"]

[project.scripts]
kgforge = "kgforge.cli:main"

[tool.setuptools]
packages = ["kgforge", "kgforge.core", "kgforge.data", "kgforge.models",
            "kgforge.eval", "kgforge.pipeline"]

# MUST stay: without pythonpath the CI test run fails with ModuleNotFoundError
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: end-to-end performance gate (slower, multi-seed)"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "RUF", "B"]
# RUF001 flags CJK fullwidth punctuation, which is correct Chinese typography here.
ignore = ["B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402"]
